# yaml-language-server: $schema=../schemas/workspace.v1.json
apiVersion: workspace/v1
kind: PluginSet
metadata:
  name: opencode
  description: OpenCode 2 plugins
spec:
  harness: opencode
  plugins:
    - package: "opencode-claude-auth@latest"
    - package: "@plannotator/opencode@latest"
      options:
        workflow: plan-agent
        planningAgents: [plan]
---
apiVersion: workspace/v1
kind: PermissionPolicy
metadata:
  name: opencode
  description: OpenCode 2 permissions (default, then allow, then ask, then deny; last match wins)
spec:
  harness: opencode
  rules:
    shell:
      default: ask
      allow:
        - "head *"
        - "tail *"
        - "sort *"
        - "uniq *"
        - "wc *"
        - "cat *"
        - "less *"
        - "file *"
        - "stat *"
        - "du *"
        - "df *"
        - "ls *"
        - "tree *"
        - "pwd *"
        - "date *"
        - "which *"
        - "where *"
        - "whoami *"
        - "groups *"
        - "command *"
        - "basename *"
        - "dirname *"
        - "realpath *"
        - "readlink *"
        - "echo *"
        - "printf *"
        - "true *"
        - "test *"
        - "diff *"
        - "cmp *"
        - "printenv *"
        - "uname *"
        - "sw_vers *"
        - "rg *"
        - "grep *"
        - "fd *"
        - "find *"
        - "awk *"
        - "sed *"
        - "jq *"
        - "yq *"
        - "base64 *"
        - "shasum *"
        - "md5 *"
        - "xargs *"
        - "mkdir *"
        - "* --help *"
        - "* --version"
        - "node *"
        - "bun *"
        - "npm *"
        - "npx *"
        - "pnpm *"
        - "python *"
        - "python3 *"
        - "pytest *"
        - "uv *"
        - "uvx *"
        - "eslint *"
        - "biome *"
        - "swift *"
        - "xcrun *"
        - "xcodebuild *"
        - "just *"
        - "bats *"
        - "shellcheck *"
        - "docker *"
        - "helm lint *"
        - "helm template *"
        - "ast-grep *"
        - "sg *"
        - "git status *"
        - "git log *"
        - "git diff *"
        - "git show *"
        - "git branch *"
        - "git fetch *"
        - "git merge-base *"
        - "git remote -v *"
        - "git ls-tree *"
        - "git ls-files *"
        - "git rev-parse *"
        - "git stash *"
        - "git mv *"
        - "git add *"
        - "git commit *"
        - "git checkout *"
        - "git switch *"
        - "git restore *"
        - "git rebase *"
        - "git merge *"
        - "git cherry-pick *"
        - "git pull *"
        - "git push *"
        - "git reset *"
        - "git clean *"
        - "git tag -l *"
        - "git worktree list *"
        - "git blame *"
        - "git reflog *"
        - "git config user.name *"
        - "git config user.email *"
        - "gh * status *"
        - "gh * view *"
        - "gh * diff *"
        - "gh * list *"
        - "gh * checks *"
        - "gh pr create *"
        - "gh pr edit *"
        - "gh pr checkout *"
        - "gh api *"
        - "gh workflow run deploy-feature.yml *"
        - "gh workflow run cleanup-feature.yml *"
        - "acli * view *"
        - "acli * search *"
        - "acli * list *"
        - "twg * search *"
        - "twg * get *"
        - "twg * view *"
        - "twg * list *"
        - "twg doctor *"
        - "sentry api *"
        - "sentry * view *"
        - "sentry * list *"
        - "kubectl get *"
        - "kubectl describe *"
        - "kubectl logs *"
        - "kubectl top *"
        - "kubectl config get-contexts *"
        - "kubectl config current-context *"
        - "aws * describe-*"
        - "aws * list-*"
        - "aws * get-*"
        - "gcloud * list *"
        - "gcloud * describe *"
        - "brew list *"
        - "brew info *"
        - "brew search *"
        - "brew outdated *"
        - "brew deps *"
        - "brew desc *"
        - "brew bundle check *"
        - "opencode debug *"
        - "opencode plugin list *"
        - "opencode api *"
      ask:
        - "git push * main*"
        - "git push * master*"
        - "git push * develop*"
        - "git push * HEAD:main*"
        - "git push * HEAD:master*"
        - "git push * HEAD:develop*"
        - "git push --force*"
        - "git push -f*"
        - "git push * --force*"
        - "git push * -f*"
        - "git push * --force-with-lease*"
        - "git push --tags*"
        - "git push * --tags*"
        - "git push * --delete*"
        - "git push * -d *"
        - "git push * :*"
        - "gh api * -X *"
        - "gh api * --method *"
        - "sentry api * -X *"
        - "sentry api * --method *"
        - "find * -delete*"
        - "find * -exec*"
        - "find * -execdir*"
        - "find * -ok*"
        - "xargs *rm *"
        - "xargs *mv *"
        - "sed -i*"
        - "sed * -i*"
        - "awk *system*"
        - "python -c *"
        - "python3 -c *"
        - "node -e *"
        - "node --eval *"
        - "bun -e *"
        - "bun --eval *"
        - "docker rm*"
        - "docker rmi*"
        - "docker system prune*"
        - "docker volume rm*"
        - "docker volume prune*"
        - "docker image prune*"
        - "docker container prune*"
        - "docker network rm*"
        - "ast-grep * -U*"
        - "ast-grep * --update-all*"
        - "ast-grep * -r *"
        - "ast-grep * --rewrite*"
        - "sg * -U*"
        - "sg * --update-all*"
        - "sg * -r *"
        - "sg * --rewrite*"
        - "npm publish*"
        - "gh pr merge*"
        - "gh pr close*"
        - "gh repo delete*"
        - "gh release *"
        - "opencode api * -X *"
    read:
      default: allow
      ask:
        - "*.env"
        - "*.env.*"
    edit:
      default: allow
    webfetch:
      default: allow
    external_directory:
      default: ask
      allow:
        - "~/.agents/*"
        - "/tmp/*"
