    - Bash(python3 *)
    - Bash(pytest *)
    - Bash(uv *)
    - Bash(uvx *)
    - Bash(eslint *)
    - Bash(biome *)
    - Bash(swift *)
    - Bash(xcrun *)
    - Bash(xcodebuild *)
    - Bash(just *)
    - Bash(bats *)
    - Bash(shellcheck *)
    - Bash(docker *)
    - Bash(helm lint *)
    - Bash(helm template *)
    - Bash(ast-grep *)
    - Bash(sg *)
    - Bash(git status *)
    - Bash(git log *)
    - Bash(git diff *)
    - Bash(git show *)
    - Bash(git branch *)
    - Bash(git fetch *)
    - Bash(git merge-base *)
    - Bash(git remote -v *)
    - Bash(git ls-tree *)
    - Bash(git ls-files *)
