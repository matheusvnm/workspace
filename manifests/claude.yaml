# yaml-language-server: $schema=../schemas/workspace.v1.json
apiVersion: workspace/v1
kind: PluginSet
metadata:
  name: claude-code
  description: Claude Code marketplaces and plugins
spec:
  harness: claude-code
  marketplaces:
    - name: plannotator
      source: backnotprop/plannotator
  plugins:
    - plannotator@plannotator
---
apiVersion: workspace/v1
kind: PermissionPolicy
metadata:
  name: claude-code
  description: Claude Code permissions (deny, then ask, then allow; the sequence in the file has no effect)
spec:
  harness: claude-code
  defaultMode: acceptEdits
  additionalDirectories:
    - ~/.claude/plans
    - ~/.claude/specs
  allow:
    - Bash(head *)
    - Bash(tail *)
    - Bash(sort *)
    - Bash(uniq *)
    - Bash(wc *)
    - Bash(cat *)
    - Bash(less *)
    - Bash(file *)
    - Bash(stat *)
    - Bash(du *)
    - Bash(df *)
    - Bash(ls *)
    - Bash(tree *)
    - Bash(pwd *)
    - Bash(date *)
    - Bash(which *)
    - Bash(where *)
    - Bash(whoami *)
    - Bash(groups *)
    - Bash(command *)
    - Bash(basename *)
    - Bash(dirname *)
    - Bash(realpath *)
    - Bash(readlink *)
    - Bash(echo *)
    - Bash(printf *)
    - Bash(true *)
    - Bash(test *)
    - Bash(diff *)
    - Bash(cmp *)
    - Bash(printenv *)
    - Bash(uname *)
    - Bash(sw_vers *)
    - Bash(rg *)
    - Bash(grep *)
