# yaml-language-server: $schema=../schemas/workspace.v1.json
apiVersion: workspace/v1
kind: Installer
metadata:
  name: twg
  description: Atlassian Teamwork Graph CLI
spec:
  bin: twg
  script: automation/installers/twg.sh
  post:
    - twg skills install --agent claude -y
  hint: Run `twg setup` to sign in to Atlassian.
  owns:
    skills: ["twg*"]
---
apiVersion: workspace/v1
kind: Installer
metadata:
  name: sentry
  description: Sentry CLI
spec:
  bin: sentry
  script: automation/installers/sentry.sh
  hint: Run `sentry auth login` to sign in to Sentry.
  owns:
    skills: ["sentry-cli"]
---
apiVersion: workspace/v1
kind: Installer
metadata:
  name: plannotator
  description: Plannotator CLI for the Claude Code plan review hooks
spec:
  bin: plannotator
  script: automation/installers/plannotator.sh
  owns:
    skills: ["plannotator*"]
